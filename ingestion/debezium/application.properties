# PostgreSQL source
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=localhost
debezium.source.database.port=15432
debezium.source.database.user=debezium_cdc
debezium.source.database.password=345978
debezium.source.database.dbname=ecommerce_db
debezium.source.topic.prefix=ecommerce_cdc
debezium.source.plugin.name=pgoutput

# Existing publication and dedicated replication slot
debezium.source.publication.name=ecommerce_cdc_pub
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=ecommerce_cdc_slot
debezium.source.table.include.list=streaming.ecommerce_events
debezium.source.snapshot.mode=initial

# Persistent offsets
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=D:/Samsung/Graduation Project/Data/Old Data/ingestion/debezium-eventhubs/data/offsets.dat

# Azure Event Hubs sink
debezium.sink.type=eventhubs
debezium.sink.eventhubs.connectionstring=${AZURE_EVENTHUB_CONNECTION_STRING}

debezium.sink.eventhubs.hubname=ecommerce-cdc-events

# Event Hubs schema history connection

# Increase PostgreSQL connector batch and queue sizes



   debezium.format.key=json
   debezium.format.key.schemas.enable=false
   debezium.format.value=json
   debezium.format.value.schemas.enable=false

   debezium.source.max.batch.size=16384
   debezium.source.max.queue.size=65536
   debezium.source.poll.interval.ms=100
   debezium.sink.eventhubs.maxbatchsize=0




